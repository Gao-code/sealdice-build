          tar - tar -zcvf ../zcvf ../sealdsealdice_ice_${PRO${PROJECT_VERSIONJECT_VERSION_C}__C}_${GO${GOOS}_OS}_${GO${GOARCH}.ARCH}.tar.gztar.gz .
          .
          echo echo " "DIST=sealdiceDIST=se_${PROJECT_VERSION_Caldice_${}_${PROJECT_VERSION_C}_${GOOS}_${GOOS}_${GOARCHGOARCH}.tar}.tar.gz".gz" >> $ >> $GITHGITHUB_ENUB_ENVV

