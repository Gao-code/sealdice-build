name: Auto Build Linux ARMv7

on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  COMMIT_ID: "${{ github.sha }}"
  NO_BUILD_PROMPT: "no new commits, no need to build."
  NT_SIGN_URL: ${{ secrets.NT_SIGN_URL }}

jobs:
  commit-num-check:
    name: Check Commit Num
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get New Commits
        id: get-commits
        run: echo "NEW_COMMIT_COUNT=$(git log --oneline --since '24 hours ago' | wc -l)" >> $GITHUB_OUTPUT

      - name: Warning
        run: if [ $(git log --oneline --since '24 hours ago' | wc -l) -le 0 ]; then echo $NO_BUILD_PROMPT; fi

    outputs:
      commit-count: ${{ steps.get-commits.outputs.NEW_COMMIT_COUNT }}

  resources-download:
    name: Download Related Resources
    runs-on: ubuntu-latest
    needs: commit-num-check
    if: ${{ needs.commit-num-check.outputs.commit-count > 0 }}
    steps:
      - name: Code
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Upload Documents
        uses: actions/upload-artifact@v4
        with:
          name: documents
          path: ./sealdice-builtins/data

  ui-build:
    name: Build UI
    runs-on: ubuntu-latest
    needs: commit-num-check
    if: ${{ needs.commit-num-check.outputs.commit-count > 0 }}
    steps:
      - name: Code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Get Commit ID
        run: |
          cd sealdice-ui
          echo "UI_CID=$(git rev-parse --short HEAD)" >> $GITHUB_ENV;

      - name: Cache ui dist get
        id: cache-ui-dist
        uses: actions/cache@v4
        env:
          cache-name: cache-ui-dist
        with:
          path: ./sealdice-ui/dist
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ env.UI_CID }}

      - if: ${{ steps.cache-ui-dist.outputs.cache-hit == 'true' }}
        name: Show cache
        continue-on-error: true
        run: ls ./sealdice-ui/dist

      - name: Install Pnpm
        uses: pnpm/action-setup@v4
        if: ${{ steps.cache-ui-dist.outputs.cache-hit != 'true' }}
        with:
          version: 10
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v4
        if: ${{ steps.cache-ui-dist.outputs.cache-hit != 'true' }}
        with:
          node-version: 20

      - name: Install Dependencies
        if: ${{ steps.cache-ui-dist.outputs.cache-hit != 'true' }}
        working-directory: ./sealdice-ui
        run: pnpm install

      - name: Build WebUI
        if: ${{ steps.cache-ui-dist.outputs.cache-hit != 'true' }}
        working-directory: ./sealdice-ui
        run: pnpm run build-only

      - name: Upload UI
        uses: actions/upload-artifact@v4
        with:
          name: sealdice-ui
          path: ./sealdice-ui/dist

  core-build:
    name: Build Core (linux/armv7)
    runs-on: ubuntu-latest
    needs: ui-build
    strategy:
      matrix:
        goos: [linux]
        goarch: [arm]
      fail-fast: true
    steps:
      - name: Apt-get Update
        run: sudo apt-get update

      - name: Code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Cross-compiler for Linux Armv7 Musl
        run: |
          wget https://github.com/sealdice/tooolchain/releases/download/1/arm-linux-musleabihf-cross.tgz
          tar zxf arm-linux-musleabihf-cross.tgz

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
          cache-dependency-path: sealdice-core/go.sum

      - name: Install Dependencies
        working-directory: ./sealdice-core
        run: |
          go mod tidy
          go get .

      - name: Get UI Resources
        uses: actions/download-artifact@v4
        with:
          name: sealdice-ui
          path: ./sealdice-core/static/frontend

      - name: Get current time
        uses: Kaven-Universe/github-action-current-date-time@v1
        id: currentTime
        with:
          format: YYYYMMDD
          timezone-offset: -480

      - name: Set Env
        working-directory: ./sealdice-core
        env:
          CUR_TIME: ${{ steps.currentTime.outputs.time }}
        run: |
          echo "PROJECT_VERSION_C=${CUR_TIME}-${COMMIT_ID::7}" >> $GITHUB_ENV;
          echo "BINARY_NAME=sealdice-core" >> $GITHUB_ENV;
          echo "CC=$(readlink -f ../arm-linux-musleabihf-cross/bin/arm-linux-musleabihf-gcc)" >> $GITHUB_ENV;
          echo "GOARM=7" >> $GITHUB_ENV;

      - name: Build Binary (linux musl)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GO111MODULE: on
          CGO_ENABLED: 1
          CGO_FLAGS: -Werror=unused-variable -Werror=implicit-function-declaration -O2
          CUR_TIME: ${{ steps.currentTime.outputs.time }}
          SEAL_TRUSTED_PRIVATE_KEY: ${{ secrets.SEAL_TRUSTED_PRIVATE_KEY }}
          SEAL_SIGN_PRIVATE_KEY: ${{ secrets.SEAL_SIGN_PRIVATE_KEY }}
          SEAL_SIGN_V3_URL: ${{ secrets.SEAL_SIGN_V3_URL }}
        working-directory: ./sealdice-core
        run: |
          go build -tags musl -o "output/$BINARY_NAME" -trimpath \
            -ldflags "-s -w -linkmode external -extldflags '-static' \
            -X sealdice-core/dice.VERSION_PRERELEASE=-dev \
            -X sealdice-core/dice.VERSION_BUILD_METADATA=+${CUR_TIME}.${COMMIT_ID::7} \
            -X sealdice-core/dice.APP_CHANNEL=dev \
            -X 'sealdice-core/dice.DefaultSignUrl=${NT_SIGN_URL}' \
            -X 'sealdice-core/dice.SealTrustedClientPrivateKey=${SEAL_TRUSTED_PRIVATE_KEY}' \
            -X 'sealdice-core/dice.SealSignClientPrivateKey=${SEAL_SIGN_PRIVATE_KEY}' \
            -X 'sealdice-core/dice.SealSignV3Url=${SEAL_SIGN_V3_URL}'" .

      - name: Run UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest
          files: ./sealdice-core/output/${{ env.BINARY_NAME }}
          args: -9 -fq

      - name: Upload Core
        uses: actions/upload-artifact@v4
        with:
          name: sealdice-core_${{ env.PROJECT_VERSION_C }}_linux_arm
          path: ./sealdice-core/output

  pack:
    name: Pack (linux/armv7)
    runs-on: ubuntu-latest
    needs:
      - resources-download
      - core-build
    steps:
      - name: Get current time
        uses: Kaven-Universe/github-action-current-date-time@v1
        id: currentTime
        with:
          format: YYYYMMDD
          timezone-offset: -480

      - name: Set Env
        env:
          CUR_TIME: ${{ steps.currentTime.outputs.time }}
        run: echo "PROJECT_VERSION_C=${CUR_TIME}-${COMMIT_ID::7}" >> $GITHUB_ENV;

      - name: Get Documents
        uses: actions/download-artifact@v4
        with:
          name: documents
          path: ./data

      - name: Get Core
        uses: actions/download-artifact@v4
        with:
          name: sealdice-core_${{ env.PROJECT_VERSION_C }}_linux_arm
          path: .

      - name: Set Execute Attribute
        run: chmod +x ./sealdice-core

      - name: Compress
        env:
          GOOS: linux
          GOARCH: arm
          CUR_TIME: ${{ steps.currentTime.outputs.time }}
        run: |
          mkdir -p sealdice_temp
          mv sealdice-core data sealdice_temp/
          cd sealdice_temp
          tar -zcvf ../sealdice_${PROJECT_VERSION_C}_${GOOS}_${GOARCH}.tar.gz .
          echo "DIST=sealdice_${PROJECT_VERSION_C}_${GOOS}_${GOARCH}.tar.gz" >> $GITHUB_ENV;

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: sealdice_${{ env.PROJECT_VERSION_C }}_linux_arm
          path: ${{ env.DIST }}
