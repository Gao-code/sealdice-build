name: Auto Build Linux ARMv7

on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  COMMIT_ID: "${{ github.sha }}"
  NO_BUILD_PROMPT: "no new commits, no need to build."
  NT_SIGN_URL: ${{ secrets.NT_SIGN_URL }}

jobs:
  # 检查近 24 小时是否有新提交，若无则跳过后续任务
  commit-num-check:
    name: Check Commit Num
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get New Commits
        id: get-commits
        run: echo "NEW_COMMIT_COUNT=$(git log --oneline --since '24 hours ago' | wc -l)" >> $GITHUB_OUTPUT

      - name: Warning
        run: if [ $(git log --oneline --since '24 hours ago' | wc -l) -le 0 ]; then echo $NO_BUILD_PROMPT; fi

    outputs:
      commit-count: ${{ steps.get-commits.outputs.NEW_COMMIT_COUNT }}

  # 下载内置数据文件（如帮助文档、默认牌堆等）
  resources-download:
    name: Download Related Resources
    runs-on: ubuntu-latest
    needs: commit-num-check
    if: ${{ needs.commit-num-check.outputs.commit-count > 0 }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Upload Documents Artifact
        uses: actions/upload-artifact@v4
        with:
          name: documents
          path: ./sealdice-builtins/data

  # 构建前端 UI 静态文件
  ui-build:
    name: Build UI
    runs-on: ubuntu-latest
    needs: commit-num-check
    if: ${{ needs.commit-num-check.outputs.commit-count > 0 }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Get UI Commit ID
        run: |
          cd sealdice-ui
          echo "UI_CID=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Cache UI Dist
        id: cache-ui-dist
        uses: actions/cache@v4
        env:
          cache-name: cache-ui-dist
        with:
          path: ./sealdice-ui/dist
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ env.UI_CID }}

      - if: ${{ steps.cache-ui-dist.outputs.cache-hit == 'true' }}
        name: Show Cache (optional)
        continue-on-error: true
        run: ls ./sealdice-ui/dist

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        if: ${{ steps.cache-ui-dist.outputs.cache-hit != 'true' }}
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        if: ${{ steps.cache-ui-dist.outputs.cache-hit != 'true' }}
        with:
          node-version: 20

      - name: Install Dependencies
        if: ${{ steps.cache-ui-dist.outputs.cache-hit != 'true' }}
        working-directory: ./sealdice-ui
        run: pnpm install

      - name: Build WebUI
        if: ${{ steps.cache-ui-dist.outputs.cache-hit != 'true' }}
        working-directory: ./sealdice-ui
        run: pnpm run build-only

      - name: Upload UI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sealdice-ui
          path: ./sealdice-ui/dist

  # 构建 Linux ARMv7 核心二进制（静态链接，禁用 sonic）
  core-build:
    name: Build Core (linux/armv7)
    runs-on: ubuntu-latest
    needs: ui-build
    strategy:
      matrix:
        goos: [linux]
        goarch: [arm]
      fail-fast: true
    steps:
      - name: Update apt cache
        run: sudo apt-get update

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install ARMv7 Cross Compiler (GCC)
        run: sudo apt-get install -y gcc-arm-linux-gnueabihf

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
          cache-dependency-path: sealdice-core/go.sum

      - name: Install Go Dependencies
        working-directory: ./sealdice-core
        run: |
          go mod tidy
          go get .

      - name: Download UI Resources
        uses: actions/download-artifact@v4
        with:
          name: sealdice-ui
          path: ./sealdice-core/static/frontend

      - name: Get Current Time (Beijing Time)
        uses: Kaven-Universe/github-action-current-date-time@v1
        id: currentTime
        with:
          format: YYYYMMDD
          timezone-offset: -480   # UTC+8

      - name: Set Build Environment Variables
        working-directory: ./sealdice-core
        env:
          CUR_TIME: ${{ steps.currentTime.outputs.time }}
        run: |
          echo "PROJECT_VERSION_C=${CUR_TIME}-${COMMIT_ID::7}" >> $GITHUB_ENV
          echo "BINARY_NAME=sealdice-core" >> $GITHUB_ENV
          echo "CC=arm-linux-gnueabihf-gcc" >> $GITHUB_ENV
          echo "GOARM=7" >> $GITHUB_ENV

      # 关键修复：使用 json_std 构建标签，强制使用 encoding/json 替代 sonic（sonic 不支持 32 位）
      # 若因某些原因 json_std 无效，可取消注释下面的 replace 步骤并删除构建命令中的 -tags=json_std
      # - name: Replace sonic with go-json (Fallback plan)
      #   working-directory: ./sealdice-core
      #   run: |
      #     go mod edit -replace github.com/bytedance/sonic=github.com/goccy/go-json@latest
      #     go mod tidy

      - name: Build Binary (Static Linked)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GO111MODULE: on
          CGO_ENABLED: 1
          CGO_FLAGS: -Werror=unused-variable -Werror=implicit-function-declaration -O2
          CUR_TIME: ${{ steps.currentTime.outputs.time }}
          SEAL_TRUSTED_PRIVATE_KEY: ${{ secrets.SEAL_TRUSTED_PRIVATE_KEY }}
          SEAL_SIGN_PRIVATE_KEY: ${{ secrets.SEAL_SIGN_PRIVATE_KEY }}
          SEAL_SIGN_V3_URL: ${{ secrets.SEAL_SIGN_V3_URL }}
        working-directory: ./sealdice-core
        run: |
          go build -tags=json_std -o "output/$BINARY_NAME" -trimpath \
            -ldflags "-s -w -linkmode external -extldflags '-static' \
            -X sealdice-core/dice.VERSION_PRERELEASE=-dev \
            -X sealdice-core/dice.VERSION_BUILD_METADATA=+${CUR_TIME}.${COMMIT_ID::7} \
            -X sealdice-core/dice.APP_CHANNEL=dev \
            -X 'sealdice-core/dice.DefaultSignUrl=${NT_SIGN_URL}' \
            -X 'sealdice-core/dice.SealTrustedClientPrivateKey=${SEAL_TRUSTED_PRIVATE_KEY}' \
            -X 'sealdice-core/dice.SealSignClientPrivateKey=${SEAL_SIGN_PRIVATE_KEY}' \
            -X 'sealdice-core/dice.SealSignV3Url=${SEAL_SIGN_V3_URL}'" .

      - name: Compress Binary with UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest
          files: ./sealdice-core/output/${{ env.BINARY_NAME }}
          args: -9 -fq

      - name: Upload Core Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sealdice-core_${{ env.PROJECT_VERSION_C }}_linux_arm
          path: ./sealdice-core/output

  # 将核心程序与内置数据打包为 .tar.gz
  pack:
    name: Pack (linux/armv7)
    runs-on: ubuntu-latest
    needs:
      - resources-download
      - core-build
    steps:
      - name: Get Current Time
        uses: Kaven-Universe/github-action-current-date-time@v1
        id: currentTime
        with:
          format: YYYYMMDD
          timezone-offset: -480

      - name: Set Env
        env:
          CUR_TIME: ${{ steps.currentTime.outputs.time }}
        run: echo "PROJECT_VERSION_C=${CUR_TIME}-${COMMIT_ID::7}" >> $GITHUB_ENV

      - name: Download Documents
        uses: actions/download-artifact@v4
        with:
          name: documents
          path: ./data

      - name: Download Core Binary
        uses: actions/download-artifact@v4
        with:
          name: sealdice-core_${{ env.PROJECT_VERSION_C }}_linux_linux_armarm
          path
          path:: .

      - .

      - name: name: Set Execute Set Execute Permission Permission
        run: chmod
        run: chmod +x ./ +sealdx ./sealdice-core

      - name: Createice-core

